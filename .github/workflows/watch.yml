name: watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check prices and trade (virtual money only)
        run: python watcher/watch.py

      - name: Save state
        run: |
          git config user.name "watcher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -q -m "watcher: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git push -q; then exit 0; fi
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 3
          done
          exit 1
